[project]
name = "imdtravel"
version = "1.0.0"
description = "IMDTravel - orquestrador de compra de passagens (Parte 1, BASELINE)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask==3.1.3",
    "gunicorn==27.0.1",
    "requests==2.34.2",
    "simplejson==4.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "requests-mock==1.12.1",
]

[tool.uv]
# aplicação, não biblioteca: o uv só instala as dependências
package = false
